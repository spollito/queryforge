# All settings come from environment variables with local-development defaults.
# For local runs, the repository-root .env file (copied from .env.example) is
# imported too; real environment variables always take precedence over it.
spring:
  application:
    name: queryforge-api
  config:
    # Resolved against the working directory, which is apps/api for ./mvnw spring-boot:run.
    import: optional:file:../../.env[.properties]
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:queryforge}
    username: ${POSTGRES_USER:queryforge}
    password: ${POSTGRES_PASSWORD:}
    hikari:
      # Milliseconds. Fail fast when PostgreSQL is unreachable so health checks
      # report DOWN within seconds instead of after Hikari's 30 s default.
      connection-timeout: 5000

server:
  port: ${API_PORT:8080}

queryforge:
  cors:
    # Comma-separated. Applies to /api/** and the Actuator endpoints.
    allowed-origins: ${API_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  # The database QueryForge analyzes. Defaults point at the sample-db Compose service.
  target:
    url: ${TARGET_DB_URL:jdbc:postgresql://localhost:5433/sample}
    username: ${TARGET_DB_USER:queryforge_reader}
    password: ${TARGET_DB_PASSWORD:}
    statement-timeout: ${TARGET_DB_STATEMENT_TIMEOUT:10s}
    # Session time zone for analysis, so timestamp literals mean the same thing wherever the API runs.
    time-zone: ${TARGET_DB_TIME_ZONE:UTC}

management:
  endpoints:
    web:
      exposure:
        include: health
      cors:
        allowed-origins: ${queryforge.cors.allowed-origins}
        allowed-methods: GET
  endpoint:
    health:
      # Report each component's status (db, diskSpace, ...) but never its
      # details, which include database product and connection information.
      show-components: always
      show-details: never
      probes:
        enabled: true
      group:
        # Liveness stays independent of PostgreSQL; readiness requires it.
        readiness:
          include: readinessState,db
