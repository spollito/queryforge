name: Bug report
description: Something in QueryForge does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened
      description: A clear description of the problem.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Commands, requests, or SQL needed to trigger the problem. Remove any credentials or private data.
      placeholder: |
        1. docker compose up -d
        2. cd apps/api && ./mvnw spring-boot:run
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - API (apps/api)
        - Web (apps/web)
        - Database / Docker Compose
        - CI
        - Documentation
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Java, Node, Docker, and PostgreSQL versions, plus the commit SHA.
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste log output. It is formatted as code automatically.
      render: shell
