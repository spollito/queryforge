name: Feature request
description: Propose a capability or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How QueryForge could address it. Include example SQL or execution plans where useful.
    validations:
      required: true
  - type: dropdown
    id: phase
    attributes:
      label: Roadmap phase
      description: Where this fits in docs/roadmap.md.
      options:
        - Phase 1 (query analysis)
        - Phase 2 (AI and automated reasoning)
        - Phase 3 (machine learning)
        - Phase 4 (production readiness)
        - Not sure
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
